<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Parcel Overlay choosing a window</title>
  <desc id="desc">A staged Parcel interface showing a frozen macOS desktop, window Selection, and Capture mode controls.</desc>
  <defs>
    <linearGradient id="desktop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dce7ef"/><stop offset=".52" stop-color="#c7d7d2"/><stop offset="1" stop-color="#d8cbe5"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#32343a"/><stop offset="1" stop-color="#202126"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b5cf6"/><stop offset=".55" stop-color="#5ee4b5"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#101116" flood-opacity=".28"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="15"/></filter>
  </defs>
  <rect width="1440" height="900" fill="url(#desktop)"/>
  <circle cx="190" cy="130" r="260" fill="#5ee4b5" opacity=".16" filter="url(#glow)"/>
  <circle cx="1250" cy="760" r="330" fill="#8b5cf6" opacity=".18" filter="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="95" y="112" width="545" height="612" rx="22" fill="#f8fafc"/>
    <rect x="95" y="112" width="545" height="56" rx="22" fill="#eef2f5"/>
    <rect x="95" y="146" width="545" height="22" fill="#eef2f5"/>
    <circle cx="128" cy="140" r="8" fill="#ff5f57"/><circle cx="154" cy="140" r="8" fill="#febc2e"/><circle cx="180" cy="140" r="8" fill="#28c840"/>
    <rect x="129" y="205" width="168" height="16" rx="8" fill="#111827" opacity=".85"/>
    <rect x="129" y="246" width="472" height="116" rx="18" fill="#eef2f6"/>
    <circle cx="184" cy="304" r="28" fill="url(#accent)" opacity=".9"/>
    <rect x="232" y="278" width="210" height="15" rx="7" fill="#26313c" opacity=".8"/>
    <rect x="232" y="311" width="322" height="11" rx="5" fill="#64748b" opacity=".45"/>
    <rect x="129" y="395" width="221" height="270" rx="18" fill="#1d2230"/>
    <rect x="375" y="395" width="226" height="128" rx="18" fill="#e7ecf0"/>
    <rect x="375" y="545" width="226" height="120" rx="18" fill="#f0e9f5"/>
    <path d="M160 608 C210 500 268 580 322 454" stroke="#5ee4b5" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="720" y="184" width="610" height="468" rx="24" fill="#ffffff"/>
    <rect x="720" y="184" width="610" height="60" rx="24" fill="#f4f5f6"/>
    <rect x="720" y="220" width="610" height="24" fill="#f4f5f6"/>
    <circle cx="755" cy="214" r="8" fill="#ff5f57"/><circle cx="781" cy="214" r="8" fill="#febc2e"/><circle cx="807" cy="214" r="8" fill="#28c840"/>
    <rect x="758" y="282" width="168" height="18" rx="9" fill="#17191f"/>
    <rect x="758" y="326" width="530" height="84" rx="16" fill="#eff3f5"/>
    <rect x="784" y="350" width="214" height="12" rx="6" fill="#6b7280" opacity=".58"/>
    <rect x="784" y="375" width="384" height="10" rx="5" fill="#9ca3af" opacity=".45"/>
    <rect x="758" y="440" width="255" height="174" rx="16" fill="#111827"/>
    <rect x="1033" y="440" width="255" height="174" rx="16" fill="#e9eef2"/>
    <circle cx="885" cy="526" r="58" fill="none" stroke="#8b5cf6" stroke-width="18" opacity=".78"/>
    <path d="M1078 560 L1122 510 L1163 535 L1222 474" stroke="#5ee4b5" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect width="1440" height="900" fill="#080a0e" opacity=".34"/>
  <rect x="698" y="164" width="654" height="510" rx="28" fill="none" stroke="#5ee4b5" stroke-width="4"/>
  <rect x="698" y="164" width="654" height="510" rx="28" fill="#5ee4b5" opacity=".035"/>
  <g fill="#5ee4b5"><rect x="688" y="154" width="20" height="20" rx="4"/><rect x="1342" y="154" width="20" height="20" rx="4"/><rect x="688" y="664" width="20" height="20" rx="4"/><rect x="1342" y="664" width="20" height="20" rx="4"/></g>

  <g transform="translate(408 42)" filter="url(#shadow)">
    <rect width="624" height="78" rx="24" fill="url(#chrome)" stroke="#ffffff" stroke-opacity=".12"/>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#c7cbd3">
      <rect x="12" y="12" width="94" height="54" rx="16" fill="#ffffff" opacity=".055"/><text x="38" y="45">Region</text>
      <rect x="112" y="12" width="98" height="54" rx="16" fill="#8b5cf6"/><text x="139" y="45" fill="white">Window</text>
      <rect x="216" y="12" width="94" height="54" rx="16" fill="#ffffff" opacity=".055"/><text x="240" y="45">Display</text>
      <rect x="316" y="12" width="82" height="54" rx="16" fill="#ffffff" opacity=".055"/><text x="343" y="45">Scroll</text>
      <rect x="404" y="12" width="82" height="54" rx="16" fill="#ffffff" opacity=".055"/><text x="429" y="45">OCR</text>
      <rect x="492" y="12" width="120" height="54" rx="16" fill="#ffffff" opacity=".055"/><text x="527" y="45">Record</text>
    </g>
  </g>

  <g transform="translate(60 790)" filter="url(#shadow)">
    <rect width="458" height="68" rx="20" fill="#15171c" opacity=".94" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="24" y="29" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="650" fill="white">Click a window to Capture it</text>
    <text x="24" y="51" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" fill="#a8acb5">Tab snaps · Esc cancels · frozen full resolution</text>
  </g>
  <circle cx="1124" cy="500" r="76" fill="#ffffff" opacity=".82" stroke="#ffffff" stroke-width="8" stroke-opacity=".35" filter="url(#shadow)"/>
  <text x="1052" y="513" font-family="ui-monospace,SFMono-Regular,monospace" font-size="22" font-weight="700" fill="#111827">Selection</text>
</svg>
