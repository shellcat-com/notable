    <rect x="210" y="252" width="244" height="15" rx="7" fill="#202631" opacity=".78"/>
    <rect x="210" y="284" width="484" height="11" rx="5" fill="#6b7280" opacity=".38"/>
    <rect x="108" y="348" width="372" height="314" rx="22" fill="#181e2b"/>
    <rect x="508" y="348" width="416" height="142" rx="22" fill="#ffffff" opacity=".78"/>
    <rect x="508" y="516" width="416" height="146" rx="22" fill="#f0e9f5"/>
    <path d="M168 602 C220 486 302 554 412 400" stroke="#5ee4b5" stroke-width="12" fill="none" stroke-linecap="round"/>
    <circle cx="260" cy="512" r="82" fill="none" stroke="#8b5cf6" stroke-width="24" opacity=".85"/>
    <path d="M578 438 C670 420 756 396 844 362" stroke="#ff4d47" stroke-width="12" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="610" y="546" width="228" height="74" rx="13" fill="#15171c" opacity=".86" filter="url(#blur)"/>
    <rect x="596" y="532" width="256" height="102" rx="16" fill="none" stroke="#ff4d47" stroke-width="5" stroke-dasharray="11 8"/>
    <rect x="122" y="364" width="344" height="282" rx="18" fill="none" stroke="#8b5cf6" stroke-width="4"/>
    <g fill="#8b5cf6"><circle cx="122" cy="364" r="8"/><circle cx="466" cy="364" r="8"/><circle cx="122" cy="646" r="8"/><circle cx="466" cy="646" r="8"/></g>

    <g transform="translate(1030 166)">
      <rect width="244" height="578" rx="22" fill="#17181c" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="22" y="39" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#a5a8b1">LAYERS</text>
      <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#d2d4da">
