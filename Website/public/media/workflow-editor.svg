<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Parcel Editor with Annotations</title>
  <desc id="desc">A staged Parcel Editor showing a Capture, Annotation toolbar, Censor, Layers, and export controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0b0e"/><stop offset=".55" stop-color="#141219"/><stop offset="1" stop-color="#0c1715"/></linearGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f7f8"/><stop offset=".55" stop-color="#e8eeec"/><stop offset="1" stop-color="#eee7f4"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b5cf6"/><stop offset=".52" stop-color="#5ee4b5"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#000" flood-opacity=".52"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ff4d47"/></marker>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <circle cx="115" cy="80" r="300" fill="#8b5cf6" opacity=".11" filter="url(#blur)"/><circle cx="1310" cy="830" r="300" fill="#5ee4b5" opacity=".1" filter="url(#blur)"/>
  <g transform="translate(70 54)" filter="url(#shadow)">
    <rect width="1300" height="792" rx="30" fill="#202125" stroke="#ffffff" stroke-opacity=".13"/>
    <rect width="1300" height="68" rx="30" fill="#292a2f"/><rect y="39" width="1300" height="29" fill="#292a2f"/>
    <circle cx="32" cy="34" r="9" fill="#ff5f57"/><circle cx="60" cy="34" r="9" fill="#febc2e"/><circle cx="88" cy="34" r="9" fill="#28c840"/>
    <text x="120" y="41" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="650" fill="#d8d9dd">Parcel</text>
    <text x="1234" y="41" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" fill="#9497a0">2×</text>

    <g transform="translate(0 68)">
