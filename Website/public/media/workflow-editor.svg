      <text x="22" y="46" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#a5a8b1">CREATE</text>
      <g transform="translate(98 14)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600">
        <rect width="74" height="46" rx="12" fill="#8b5cf6"/><text x="20" y="29" fill="white">Arrow</text>
        <rect x="82" width="92" height="46" rx="12" fill="#ffffff" opacity=".055"/><text x="99" y="29" fill="#b7bac2">Rectangle</text>
        <rect x="182" width="74" height="46" rx="12" fill="#ffffff" opacity=".055"/><text x="201" y="29" fill="#b7bac2">Text</text>
        <rect x="264" width="78" height="46" rx="12" fill="#ffffff" opacity=".055"/><text x="281" y="29" fill="#b7bac2">Pencil</text>
        <rect x="350" width="82" height="46" rx="12" fill="#ffffff" opacity=".055"/><text x="369" y="29" fill="#b7bac2">Censor</text>
        <rect x="440" width="88" height="46" rx="12" fill="#ffffff" opacity=".055"/><text x="457" y="29" fill="#b7bac2">Spotlight</text>
        <rect x="536" width="72" height="46" rx="12" fill="#ffffff" opacity=".055"/><text x="554" y="29" fill="#b7bac2">Loupe</text>
