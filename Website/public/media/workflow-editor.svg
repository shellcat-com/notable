        <rect x="82" width="74" height="44" rx="12" fill="#ffffff" opacity=".07"/><text x="102" y="28" fill="#d5d7dc">Save</text>
        <rect x="164" width="88" height="44" rx="12" fill="#5ee4b5"/><text x="184" y="28" fill="#07110e">Export</text>
      </g>
    </g>

