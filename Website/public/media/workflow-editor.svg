        <rect x="14" y="120" width="216" height="52" rx="13" fill="#ffffff" opacity=".045"/><circle cx="38" cy="146" r="8" fill="#8b5cf6"/><text x="58" y="151">Rectangle</text>
        <rect x="14" y="180" width="216" height="52" rx="13" fill="#ffffff" opacity=".045"/><circle cx="38" cy="206" r="8" fill="#a6a8ae"/><text x="58" y="211">Censor</text>
        <rect x="14" y="240" width="216" height="52" rx="13" fill="#ffffff" opacity=".045"/><circle cx="38" cy="266" r="8" fill="#5ee4b5"/><text x="58" y="271">Spotlight</text>
      </g>
      <text x="22" y="342" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#a5a8b1">STYLE</text>
      <circle cx="38" cy="386" r="15" fill="#ff4d47"/><rect x="66" y="376" width="148" height="20" rx="10" fill="#ffffff" opacity=".08"/>
      <rect x="22" y="422" width="194" height="8" rx="4" fill="#ffffff" opacity=".09"/><rect x="22" y="422" width="112" height="8" rx="4" fill="#5ee4b5"/>
      <rect x="22" y="464" width="90" height="38" rx="11" fill="#ffffff" opacity=".07"/><rect x="122" y="464" width="94" height="38" rx="11" fill="#ffffff" opacity=".07"/>
      <rect x="22" y="522" width="194" height="42" rx="12" fill="#ffffff" opacity=".08"/><text x="75" y="548" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#c9cbd1">Bring forward</text>
