    <text x="70" y="36" fill="white" font-family="system-ui,sans-serif" font-size="24" font-weight="700">Parcel</text>
  </g>
  <text x="68" y="230" fill="white" font-family="system-ui,sans-serif" font-size="61" font-weight="740" letter-spacing="-2">Capture anything.</text>
  <text x="68" y="300" fill="#5ee4b5" font-family="Georgia,serif" font-size="61" font-style="italic">Make it unmistakable.</text>
  <text x="70" y="355" fill="#b4b6bd" font-family="system-ui,sans-serif" font-size="20">Native macOS Capture · Local Vision · No cloud AI</text>
