<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#12151c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="200" cy="120" r="180" fill="#8b5cf6" opacity="0.2" filter="url(#glow)"/>
  <circle cx="980" cy="480" r="200" fill="#ec4899" opacity="0.15" filter="url(#glow)"/>
  <text x="80" y="120" fill="#5ee4b5" font-family="ui-monospace, monospace" font-size="14" letter-spacing="0.22em">NATIVE MACOS · MIT · FROM PARABLE</text>
  <text x="80" y="210" fill="white" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="700">Capture, mark up,</text>
  <text x="80" y="285" fill="white" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="700">and ship.</text>
  <text x="80" y="340" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="22">Local-first. No network AI. On screen = saved.</text>
  <!-- browser mock -->
  <g transform="translate(620 90)">
    <rect width="500" height="420" rx="14" fill="#1a1d24" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="24" cy="24" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="24" r="6" fill="#febc2e"/>
    <circle cx="64" cy="24" r="6" fill="#28c840"/>
    <rect x="90" y="14" width="280" height="20" rx="6" fill="rgba(255,255,255,0.06)"/>
    <text x="110" y="28" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">parcel.parable.dev/editor</text>
    <rect x="12" y="48" width="476" height="360" rx="8" fill="#0a0c10"/>
    <rect x="28" y="64" width="56" height="22" rx="5" fill="rgba(139,92,246,0.35)" stroke="#8b5cf6"/>
    <rect x="92" y="64" width="44" height="22" rx="5" fill="rgba(255,255,255,0.05)"/>
    <rect x="142" y="64" width="44" height="22" rx="5" fill="rgba(255,255,255,0.05)"/>
    <rect x="28" y="100" width="444" height="280" rx="10" fill="url(#bg)"/>
    <line x1="120" y1="280" x2="320" y2="180" stroke="#5ee4b5" stroke-width="3" marker-end="url(#none)"/>
    <rect x="260" y="220" width="100" height="50" rx="4" fill="rgba(236,72,153,0.25)" stroke="#ec4899" stroke-dasharray="4 3"/>
    <text x="80" y="520" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">14 tools · Beautify · Vision · History</text>
