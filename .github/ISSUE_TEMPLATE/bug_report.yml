name: Bug report
description: Something broke in Parcel
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 26.0
    validations:
      required: true
  - type: checkboxes
    id: permission
    attributes:
      label: Screen Recording granted?
      options:
        - label: Yes, and I quit/reopened Parcel after granting
          required: true
